<title>오.담.완 - 오늘의 영감 담기 완료</title>
<style>
  :root{
    --deep-indigo:#2c2a5e;
    --violet:#6b5ce0;
    --gold:#e8b84b;
    --gold-deep:#d99420;
    --paper:#fbf8ff;
    --ink:#2f2b40;
    --line:#dcd4f2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    min-height:100vh;
    background:linear-gradient(180deg,#1c1a3e 0%,#2c2a5e 25%,#6b5ce0 60%,#9b8ce8 82%,#e8b84b 100%);
    background-attachment:fixed;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px;
  }
  .app{
    width:100%;
    max-width:1080px;
    display:grid;
    grid-template-columns:240px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:760px){
    body{padding:16px 10px;}
    .app{grid-template-columns:1fr; gap:14px;}
    .sidebar{
      position:static;
      max-height:220px;
      padding:14px;
    }
    .card{padding:20px 16px;}
  }
  @media (max-width:420px){
    .title{font-size:24px; letter-spacing:4px;}
    .section{padding:12px 14px;}
    .set-card{padding:12px 14px;}
    button{padding:10px 18px; font-size:13px;}
  }

  /* Sidebar */
  .sidebar{
    background:rgba(251,248,255,0.94);
    border-radius:16px;
    padding:18px;
    box-shadow:0 8px 24px rgba(20,10,50,0.3);
    position:sticky;
    top:32px;
    max-height:calc(100vh - 64px);
    overflow-y:auto;
  }
  .sidebar h2{
    margin:0 0 12px;
    font-size:16px;
    color:var(--deep-indigo);
    border-bottom:2px solid var(--gold);
    padding-bottom:8px;
  }
  .search-box{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:16px;
    margin-bottom:12px;
    font-family:inherit;
  }
  .search-box:focus{
    outline:none;
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(107,92,224,0.15);
  }
  #dateList{
    list-style:none;
    margin:0;
    padding:0;
  }
  #dateList li{
    margin-bottom:4px;
  }
  #dateList a{
    display:block;
    padding:8px 10px;
    border-radius:8px;
    text-decoration:none;
    color:var(--ink);
    font-size:14px;
    background:transparent;
    transition:background .15s, color .15s;
  }
  #dateList a .sub-preview{
    display:block;
    font-size:11px;
    color:#8a80b0;
    margin-top:2px;
  }
  #dateList a:hover{
    background:linear-gradient(90deg,var(--violet),var(--gold));
    color:#fff;
  }
  #dateList a:hover .sub-preview{color:rgba(255,255,255,0.85);}
  #dateList a.active{
    background:linear-gradient(90deg,var(--deep-indigo),var(--violet));
    color:#fff;
    font-weight:bold;
  }
  #dateList a.active .sub-preview{color:rgba(255,255,255,0.85);}
  .empty-note{
    font-size:13px;
    color:#9088ad;
    padding:8px 2px;
  }

  /* Main card */
  .card{
    background:rgba(251,248,255,0.96);
    border-radius:20px;
    padding:28px 32px;
    box-shadow:0 10px 30px rgba(20,10,50,0.35);
  }
  .title{
    text-align:center;
    margin:0 0 4px;
    font-size:30px;
    letter-spacing:6px;
    background:linear-gradient(90deg,var(--deep-indigo),var(--violet),var(--gold-deep));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:900;
  }
  .subtitle{
    text-align:center;
    margin:0 0 24px;
    font-size:13px;
    color:#847bab;
  }

  .date-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .date-row input[type=number]{
    width:70px;
    padding:8px;
    border:1px solid var(--line);
    border-radius:8px;
    text-align:center;
    font-size:16px;
  }
  .date-row input[type=number].day{width:56px;}
  .date-row span{color:var(--deep-indigo);font-weight:bold;}

  .sets-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .sets-heading h2{
    margin:0;
    font-size:16px;
    color:var(--deep-indigo);
  }
  .sets-heading .hint{
    font-size:12px;
    color:#9088ad;
  }

  .set-card{
    position:relative;
    margin-bottom:16px;
    border-radius:14px;
    padding:18px 20px;
    background:#fffefc;
    border:1px solid var(--line);
  }
  .set-card::before{
    content:attr(data-index);
    position:absolute;
    top:-10px;
    left:16px;
    background:linear-gradient(90deg,var(--violet),var(--deep-indigo));
    color:#fff;
    font-size:11px;
    font-weight:bold;
    padding:2px 10px;
    border-radius:999px;
  }
  .set-remove{
    position:absolute;
    top:10px;
    right:12px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:#e3a9a0;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:14px;
  }

  .meta-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .meta-row .meta-field{
    flex:1;
    min-width:140px;
  }
  .meta-row label{
    display:block;
    font-size:12px;
    color:#847bab;
    margin-bottom:4px;
  }
  .meta-row input[type=text]{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:16px;
    font-family:inherit;
    background:#fff;
  }
  .meta-row input[type=text]:focus{
    outline:none;
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(107,92,224,0.15);
  }

  .sub-section{
    margin-bottom:14px;
  }
  .sub-section > label.sub-label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:var(--deep-indigo);
    margin-bottom:8px;
  }

  /* 채널 칩 */
  .channel-chips{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .channel-chip{
    font-size:12px;
    padding:4px 10px;
    border-radius:999px;
    background:#f3ecff;
    color:var(--deep-indigo);
    cursor:pointer;
    border:1px solid var(--line);
  }
  .channel-chip:hover{background:var(--violet);color:#fff;}

  /* bullet list */
  .bullet-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .bullet-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .bullet-item .bullet-mark{
    flex-shrink:0;
    width:20px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--violet);
    font-size:18px;
    font-weight:900;
  }
  .bullet-item textarea{
    flex:1;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:16px;
    font-family:inherit;
    background:#fff;
    resize:none;
    overflow:hidden;
    line-height:1.5;
  }
  .bullet-item textarea:focus{
    outline:none;
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(107,92,224,0.15);
  }
  .bullet-item .bullet-del{
    flex-shrink:0;
    width:26px;
    height:26px;
    margin-top:6px;
    border-radius:50%;
    background:#e3a9a0;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:14px;
  }
  .bullet-add{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 14px;
    border-radius:20px;
    background:linear-gradient(90deg,var(--violet),var(--deep-indigo));
    color:#fff;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    border:none;
  }

  /* 해시태그 */
  .tag-input-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
  }
  .tag-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:13px;
    padding:5px 6px 5px 12px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--violet),var(--deep-indigo));
    color:#fff;
  }
  .tag-chip .tag-del{
    width:16px;
    height:16px;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:11px;
  }
  .tag-input{
    flex:1;
    min-width:100px;
    border:none;
    outline:none;
    font-size:16px;
    font-family:inherit;
    padding:6px 2px;
  }

  .add-set-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:13px;
    border-radius:14px;
    border:2px dashed var(--violet);
    background:rgba(107,92,224,0.06);
    color:var(--deep-indigo);
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:24px;
  }
  .add-set-btn:hover{background:rgba(107,92,224,0.12);}

  /* photo */
  .photo-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .photo-item{
    position:relative;
    width:72px;
    height:72px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
  }
  .photo-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor:pointer;
  }
  .photo-item .photo-del{
    position:absolute;
    top:2px;
    right:2px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:rgba(0,0,0,0.55);
    color:#fff;
    font-size:12px;
    line-height:18px;
    text-align:center;
    cursor:pointer;
  }
  .photo-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,10,35,0.85);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:24px;
    cursor:zoom-out;
  }
  .photo-modal.open{display:flex;}
  .photo-modal img{
    max-width:100%;
    max-height:100%;
    border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
  }
  .photo-modal .photo-modal-close{
    position:absolute;
    top:16px;
    right:20px;
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
  }

  .comment-section{
    margin-bottom:20px;
    border-radius:14px;
    padding:16px 18px;
    background:#fffefc;
    border:1px solid var(--line);
    border-left:5px solid var(--gold);
  }
  .comment-section h3{
    margin:0 0 10px;
    font-size:15px;
    color:var(--deep-indigo);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .comment-section textarea{
    width:100%;
    min-height:90px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:16px;
    font-family:inherit;
    resize:none;
    overflow:hidden;
    background:#fff;
  }
  .comment-section textarea:focus{
    outline:none;
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(107,92,224,0.15);
  }

  .btn-row{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button{
    border:none;
    border-radius:24px;
    padding:11px 26px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    color:#fff;
    transition:transform .15s, box-shadow .15s;
  }
  button:hover{transform:translateY(-2px);}
  #saveBtn{
    background:linear-gradient(90deg,var(--deep-indigo),var(--violet));
    box-shadow:0 6px 14px rgba(44,42,94,0.35);
  }
  #newBtn{
    background:linear-gradient(90deg,var(--gold-deep),var(--gold));
    box-shadow:0 6px 14px rgba(217,148,32,0.35);
  }
  #deleteBtn{
    background:#a89bc9;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
  }
  .status{
    text-align:center;
    font-size:12px;
    color:#847bab;
    margin-top:10px;
    min-height:16px;
  }

  .rec-btn{
    border:none;
    border-radius:50%;
    width:30px;
    height:30px;
    padding:0;
    font-size:14px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background:linear-gradient(135deg,var(--violet),var(--deep-indigo));
    color:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,0.18);
    transition:transform .15s;
  }
  .rec-btn:hover{transform:translateY(-1px);}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h2>✨ 영감 목록</h2>
    <input type="text" id="searchBox" class="search-box" placeholder="해시태그·내용 검색">
    <ul id="dateList"></ul>
  </aside>

  <main class="card">
    <h1 class="title">오.담.완</h1>
    <p class="subtitle">오늘의 영감 담기 완료</p>

    <div class="date-row">
      <input type="number" id="yearInput" placeholder="년" min="2000" max="2100">
      <span>년</span>
      <input type="number" id="monthInput" class="day" placeholder="월" min="1" max="12">
      <span>월</span>
      <input type="number" id="dayInput" class="day" placeholder="일" min="1" max="31">
      <span>일</span>
    </div>

    <div class="sets-heading">
      <h2>오늘 본 것들</h2>
      <span class="hint">채널별로 세트를 나눠 기록하세요</span>
    </div>

    <div id="setsContainer"></div>
    <button type="button" class="add-set-btn" id="addSetBtn">＋ 다른 채널 기록 추가</button>

    <div class="comment-section">
      <h3>
        <span>📝 코멘트</span>
        <button type="button" class="rec-btn" id="addPhotoBtn" title="사진 첨부">📷</button>
      </h3>
      <textarea id="commentBox" placeholder="자유롭게 오늘의 생각을 적어보세요..."></textarea>
      <div class="photo-list" id="photoList"></div>
      <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
    </div>

    <div class="btn-row">
      <button id="newBtn">새 기록</button>
      <button id="saveBtn">저장하기</button>
      <button id="deleteBtn">삭제</button>
    </div>
    <p class="status" id="statusMsg"></p>
  </main>
</div>

<div class="photo-modal" id="photoModal">
  <div class="photo-modal-close" id="photoModalClose">×</div>
  <img id="photoModalImg" src="" alt="">
</div>

<script>
(function(){
  const STORAGE_KEY = 'odamwan_entries';
  const CHANNEL_PRESETS = ['책','유튜브','기사','팟캐스트','SNS','강연','대화'];

  const yearInput = document.getElementById('yearInput');
  const monthInput = document.getElementById('monthInput');
  const dayInput = document.getElementById('dayInput');
  const setsContainer = document.getElementById('setsContainer');
  const addSetBtn = document.getElementById('addSetBtn');
  const commentBox = document.getElementById('commentBox');
  const dateListEl = document.getElementById('dateList');
  const statusMsg = document.getElementById('statusMsg');
  const searchBox = document.getElementById('searchBox');

  function loadEntries(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    }catch(e){
      return {};
    }
  }
  function saveEntries(entries){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      return true;
    }catch(e){
      return false;
    }
  }

  // 이전 버전(1채널 고정) 데이터를 sets 배열 구조로 변환
  function normalizeEntry(entry){
    entry = entry || {};
    if(Array.isArray(entry.sets)){
      return entry;
    }
    const legacySet = {
      title: entry.title || '',
      author: entry.author || '',
      channel: entry.channel || '',
      bullets: entry.bullets || [],
      tags: entry.tags || []
    };
    const hasLegacyContent = legacySet.channel || legacySet.bullets.length || legacySet.tags.length;
    return {
      sets: hasLegacyContent ? [legacySet] : [],
      comment: entry.comment || '',
      photos: entry.photos || []
    };
  }

  function autosize(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }
  commentBox.addEventListener('input', function(){ autosize(commentBox); });

  // ---- 세트 카드 (제목/작가/채널/문장/해시태그) ----
  let setCards = [];

  function createSetCard(data){
    data = data || {};
    const card = document.createElement('div');
    card.className = 'set-card';

    const remove = document.createElement('div');
    remove.className = 'set-remove';
    remove.textContent = '×';
    remove.title = '이 세트 삭제';
    remove.addEventListener('click', function(){
      const idx = setCards.indexOf(cardObj);
      if(idx > -1) setCards.splice(idx, 1);
      card.remove();
      reindexSetCards();
    });
    card.appendChild(remove);

    // 제목 / 작가
    const metaRow = document.createElement('div');
    metaRow.className = 'meta-row';
    const titleField = document.createElement('div');
    titleField.className = 'meta-field';
    titleField.innerHTML = '<label>제목</label>';
    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.placeholder = '책·영상·글의 제목';
    titleInput.value = data.title || '';
    titleField.appendChild(titleInput);

    const authorField = document.createElement('div');
    authorField.className = 'meta-field';
    authorField.innerHTML = '<label>작가 / 만든 사람</label>';
    const authorInput = document.createElement('input');
    authorInput.type = 'text';
    authorInput.placeholder = '저자·크리에이터·출처';
    authorInput.value = data.author || '';
    authorField.appendChild(authorInput);

    metaRow.appendChild(titleField);
    metaRow.appendChild(authorField);
    card.appendChild(metaRow);

    // 채널
    const channelSection = document.createElement('div');
    channelSection.className = 'sub-section';
    channelSection.innerHTML = '<label class="sub-label">📚 채널 분류</label>';
    const channelInput = document.createElement('input');
    channelInput.type = 'text';
    channelInput.placeholder = '예: 책, 유튜브, 기사, 팟캐스트, SNS...';
    channelInput.style.width = '100%';
    channelInput.style.padding = '9px 10px';
    channelInput.style.border = '1px solid var(--line)';
    channelInput.style.borderRadius = '8px';
    channelInput.style.fontSize = '16px';
    channelInput.style.fontFamily = 'inherit';
    channelInput.value = data.channel || '';
    channelSection.appendChild(channelInput);

    const chipsWrap = document.createElement('div');
    chipsWrap.className = 'channel-chips';
    CHANNEL_PRESETS.forEach(function(label){
      const chip = document.createElement('span');
      chip.className = 'channel-chip';
      chip.textContent = label;
      chip.addEventListener('click', function(){ channelInput.value = label; });
      chipsWrap.appendChild(chip);
    });
    channelSection.appendChild(chipsWrap);
    card.appendChild(channelSection);

    // 문장 (bullet list)
    const bulletSection = document.createElement('div');
    bulletSection.className = 'sub-section';
    bulletSection.innerHTML = '<label class="sub-label">💭 기억하고 싶은 문장</label>';
    const bulletListEl = document.createElement('div');
    bulletListEl.className = 'bullet-list';
    bulletSection.appendChild(bulletListEl);
    const addBulletBtn = document.createElement('button');
    addBulletBtn.type = 'button';
    addBulletBtn.className = 'bullet-add';
    addBulletBtn.textContent = '＋ 문장 추가';
    bulletSection.appendChild(addBulletBtn);
    card.appendChild(bulletSection);

    function addBulletRow(value){
      const row = document.createElement('div');
      row.className = 'bullet-item';
      const mark = document.createElement('div');
      mark.className = 'bullet-mark';
      mark.textContent = '•';
      const textarea = document.createElement('textarea');
      textarea.rows = 1;
      textarea.placeholder = '기억하고 싶은 문장을 적어보세요';
      textarea.value = value || '';
      textarea.addEventListener('input', function(){ autosize(textarea); });
      const del = document.createElement('div');
      del.className = 'bullet-del';
      del.textContent = '×';
      del.addEventListener('click', function(){
        row.remove();
        if(bulletListEl.children.length === 0) addBulletRow('');
      });
      row.appendChild(mark);
      row.appendChild(textarea);
      row.appendChild(del);
      bulletListEl.appendChild(row);
      autosize(textarea);
      return textarea;
    }
    addBulletBtn.addEventListener('click', function(){
      const t = addBulletRow('');
      t.focus();
    });
    const initialBullets = (data.bullets && data.bullets.length) ? data.bullets : [''];
    initialBullets.forEach(v => addBulletRow(v));

    // 해시태그
    const tagSection = document.createElement('div');
    tagSection.className = 'sub-section';
    tagSection.innerHTML = '<label class="sub-label">🔖 해시태그</label>';
    const tagInputRow = document.createElement('div');
    tagInputRow.className = 'tag-input-row';
    const tagInput = document.createElement('input');
    tagInput.type = 'text';
    tagInput.className = 'tag-input';
    tagInput.placeholder = '입력 후 Enter 또는 , ';
    tagInputRow.appendChild(tagInput);
    tagSection.appendChild(tagInputRow);
    card.appendChild(tagSection);

    let tags = (data.tags || []).slice();
    function renderTags(){
      tagInputRow.querySelectorAll('.tag-chip').forEach(el => el.remove());
      tags.forEach(function(tag, idx){
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        const label = document.createElement('span');
        label.textContent = '#' + tag;
        const del = document.createElement('span');
        del.className = 'tag-del';
        del.textContent = '×';
        del.addEventListener('click', function(){
          tags.splice(idx, 1);
          renderTags();
        });
        chip.appendChild(label);
        chip.appendChild(del);
        tagInputRow.insertBefore(chip, tagInput);
      });
    }
    function commitTag(){
      const raw = tagInput.value.trim().replace(/^#/, '');
      if(raw && !tags.includes(raw)){
        tags.push(raw);
        renderTags();
      }
      tagInput.value = '';
    }
    tagInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ','){
        e.preventDefault();
        commitTag();
      } else if(e.key === 'Backspace' && tagInput.value === '' && tags.length > 0){
        tags.pop();
        renderTags();
      }
    });
    tagInput.addEventListener('blur', function(){
      if(tagInput.value.trim()) commitTag();
    });
    tagInputRow.addEventListener('click', function(){ tagInput.focus(); });
    renderTags();

    const cardObj = {
      el: card,
      getData(){
        const bullets = Array.from(bulletListEl.querySelectorAll('textarea'))
          .map(t => t.value.trim())
          .filter(v => v.length > 0);
        return {
          title: titleInput.value.trim(),
          author: authorInput.value.trim(),
          channel: channelInput.value.trim(),
          bullets: bullets,
          tags: tags.slice()
        };
      },
      isEmpty(){
        const d = this.getData();
        return !d.title && !d.author && !d.channel && d.bullets.length === 0 && d.tags.length === 0;
      }
    };
    return cardObj;
  }

  function reindexSetCards(){
    setCards.forEach(function(c, i){
      c.el.setAttribute('data-index', (i+1) + '번째');
    });
  }

  function addSetCard(data){
    const cardObj = createSetCard(data);
    setCards.push(cardObj);
    setsContainer.appendChild(cardObj.el);
    reindexSetCards();
    return cardObj;
  }

  addSetBtn.addEventListener('click', function(){
    addSetCard();
  });

  function clearSets(){
    setsContainer.innerHTML = '';
    setCards = [];
  }

  function setSets(list){
    clearSets();
    if(!list || list.length === 0){
      addSetCard();
    } else {
      list.forEach(v => addSetCard(v));
    }
  }

  function getSets(){
    return setCards.map(c => c.getData()).filter(c => !(c.title==='' && c.author==='' && c.channel==='' && c.bullets.length===0 && c.tags.length===0));
  }

  // ---- 사진 첨부 + 라이트박스 ----
  let photos = [];
  const photoList = document.getElementById('photoList');
  const photoInput = document.getElementById('photoInput');
  const photoModal = document.getElementById('photoModal');
  const photoModalImg = document.getElementById('photoModalImg');

  function openPhotoModal(src){
    photoModalImg.src = src;
    photoModal.classList.add('open');
  }
  function closePhotoModal(){
    photoModal.classList.remove('open');
    photoModalImg.src = '';
  }
  photoModal.addEventListener('click', closePhotoModal);
  document.getElementById('photoModalClose').addEventListener('click', function(e){
    e.stopPropagation();
    closePhotoModal();
  });

  function renderPhotos(){
    photoList.innerHTML = '';
    photos.forEach(function(src, idx){
      const item = document.createElement('div');
      item.className = 'photo-item';
      const img = document.createElement('img');
      img.src = src;
      img.addEventListener('click', function(){ openPhotoModal(src); });
      const del = document.createElement('div');
      del.className = 'photo-del';
      del.textContent = '×';
      del.addEventListener('click', function(){
        photos.splice(idx, 1);
        renderPhotos();
      });
      item.appendChild(img);
      item.appendChild(del);
      photoList.appendChild(item);
    });
  }

  document.getElementById('addPhotoBtn').addEventListener('click', function(){
    photoInput.click();
  });

  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      const reader = new FileReader();
      reader.onload = function(){
        const img = new Image();
        img.onload = function(){
          let w = img.width, h = img.height;
          if(w > maxDim || h > maxDim){
            if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', function(e){
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;
    Promise.all(files.map(function(file){
      return compressImage(file, 1280, 0.75).catch(function(){ return null; });
    })).then(function(results){
      results.forEach(function(src){ if(src) photos.push(src); });
      renderPhotos();
    });
    photoInput.value = '';
  });

  // ---- 날짜 ----
  function currentKey(){
    if(!yearInput.value || !monthInput.value || !dayInput.value) return null;
    const yy = String(yearInput.value).padStart(4,'0');
    const mm = String(monthInput.value).padStart(2,'0');
    const dd = String(dayInput.value).padStart(2,'0');
    return yy+'-'+mm+'-'+dd;
  }

  function clearForm(){
    setSets([]);
    commentBox.value = '';
    autosize(commentBox);
    photos = [];
    renderPhotos();
  }

  function fillForm(entry){
    const norm = normalizeEntry(entry);
    setSets(norm.sets);
    commentBox.value = norm.comment || '';
    autosize(commentBox);
    photos = (norm.photos || []).slice();
    renderPhotos();
  }

  function matchesSearch(entry, key, q){
    if(!q) return true;
    const norm = normalizeEntry(entry);
    const hay = [
      key,
      norm.sets.map(s => s.title + ' ' + s.author + ' ' + s.channel + ' ' + s.tags.join(' ') + ' ' + s.bullets.join(' ')).join(' '),
      norm.comment || ''
    ].join(' ').toLowerCase();
    return hay.includes(q.toLowerCase().replace(/^#/, ''));
  }

  function renderList(activeKey){
    const entries = loadEntries();
    const q = searchBox.value.trim();
    const keys = Object.keys(entries)
      .filter(key => matchesSearch(entries[key], key, q))
      .sort().reverse();
    dateListEl.innerHTML = '';
    if(keys.length === 0){
      const li = document.createElement('li');
      li.innerHTML = '<div class="empty-note">' + (q ? '검색 결과가 없어요' : '아직 저장된 기록이 없어요') + '</div>';
      dateListEl.appendChild(li);
      return;
    }
    keys.forEach(key=>{
      const norm = normalizeEntry(entries[key]);
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#';
      const channels = norm.sets.map(s => s.channel).filter(Boolean);
      const title = document.createElement('span');
      title.textContent = key + (channels.length ? ' · ' + channels.join(', ') : '');
      a.appendChild(title);
      const allTags = Array.from(new Set([].concat(...norm.sets.map(s => s.tags))));
      if(allTags.length){
        const preview = document.createElement('span');
        preview.className = 'sub-preview';
        preview.textContent = allTags.map(t => '#'+t).join(' ');
        a.appendChild(preview);
      }
      if(key === activeKey) a.classList.add('active');
      a.addEventListener('click', function(e){
        e.preventDefault();
        loadEntryByKey(key);
      });
      li.appendChild(a);
      dateListEl.appendChild(li);
    });
  }

  function loadEntryByKey(key){
    const entries = loadEntries();
    const entry = entries[key];
    if(!entry) return;
    const [y,m,d] = key.split('-');
    yearInput.value = parseInt(y,10);
    monthInput.value = parseInt(m,10);
    dayInput.value = parseInt(d,10);
    fillForm(entry);
    renderList(key);
    statusMsg.textContent = key + ' 기록을 불러왔어요';
  }

  searchBox.addEventListener('input', function(){ renderList(null); });

  document.getElementById('saveBtn').addEventListener('click', function(){
    const key = currentKey();
    if(!key){
      statusMsg.textContent = '년/월/일을 모두 입력해주세요';
      return;
    }
    const entries = loadEntries();
    entries[key] = {
      sets: getSets(),
      comment: commentBox.value,
      photos: photos.slice()
    };
    const ok = saveEntries(entries);
    if(!ok){
      statusMsg.textContent = '저장 공간이 부족해요. 사진을 줄여보세요';
      return;
    }
    renderList(key);
    statusMsg.textContent = key + ' 저장 완료 ✨';
  });

  document.getElementById('newBtn').addEventListener('click', function(){
    yearInput.value = '';
    monthInput.value = '';
    dayInput.value = '';
    clearForm();
    renderList(null);
    statusMsg.textContent = '날짜를 입력하고 새 기록을 시작하세요';
  });

  document.getElementById('deleteBtn').addEventListener('click', function(){
    const key = currentKey();
    if(!key) return;
    const entries = loadEntries();
    if(!entries[key]){
      statusMsg.textContent = '저장된 기록이 아니에요';
      return;
    }
    delete entries[key];
    saveEntries(entries);
    clearForm();
    renderList(null);
    statusMsg.textContent = key + ' 기록을 삭제했어요';
  });

  // init
  (function init(){
    clearForm();
    renderList(null);
    const today = new Date();
    yearInput.value = today.getFullYear();
    monthInput.value = today.getMonth() + 1;
    dayInput.value = today.getDate();
  })();
})();
</script>
</body>
</html>
